<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Ceria - indonesia</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Check User-Agent perangkat seluler
            const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            // Check lebar layar (misal: dibawah 768px)
            const isMobileScreen = window.innerWidth <= 768;

            if (isMobileUA || isMobileScreen) {
                document.body.innerHTML = `
                    <div style="text-align: center; padding: 50px; font-family: sans-serif;">
                        <h1>Akses Ditolak</h1>
                        <p>Website ini hanya dapat diakses melalui komputer / laptop (Desktop).</p>
                    </div>
                `;
            }
        });
    </script>
    <link rel="shortcut icon" href="../../../../../gambar.icon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../../../../style.css">
</head>
<body>
    <div id="alertBox">
        <h1 id="judul">Halo!</h1>
        <button class="btn" onclick="tutupAlert()">OK</button>
    </div>
    <div class="kotak-wadah">
        <div class="kotak-class-1">
            <div class="kotak-1"></div>
            <div class="kotak-2"></div>
            <div class="kotak-3"></div>
            <div class="kotak-4"></div>
            <div class="kotak-5"></div>
        </div>
        <div class="kotak-class-2">
            <div class="kotak-6"></div>
            <div class="kotak-7"></div>
            <div class="kotak-8"></div>
            <div class="kotak-9"></div>
            <div class="kotak-10"></div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
